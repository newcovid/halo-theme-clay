# 每次推送都跑一遍「能不能构建、能不能打包、包里对不对」。
#
# 这个仓库是 halo-theme-higan-hz 的硬分叉，上游那 17 条工作流没有跟着搬过来——
# 它们绑在上游自己的基础设施上（Argos 视觉回归、应用市场同步、文档站、夜间预发布）。
# 这里只保留在本仓库能真正跑起来、且能挡住已经发生过的事故的那几项。
#
# 挡不住的那部分要说清楚：SRI 与页面重量的核对需要一个跑着的 Halo 实例，
# 只能在本地跑（scripts/regression/），CI 覆盖不到。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # husky 的钩子只服务本地提交，CI 里装它没有意义
  HUSKY: 0

jobs:
  build:
    name: 构建与打包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install pyyaml

      # --force 是必须的：rolldown 的平台二进制走 optionalDependencies，
      # 普通 install 会静默漏装，退出码仍是 0，随后构建才崩。
      - name: 安装依赖
        run: pnpm install --force

      - name: Lint 与类型检查
        run: pnpm lint

      # lint 脚本一律带 --fix。改到了文件就说明提交里有没跑 lint 的内容，
      # 这一步把「本地忘了跑」变成 CI 上的红灯，而不是下一个人的 diff 噪声。
      - name: lint 不应改动仓库内容
        run: git diff --exit-code

      # 配置项参考是导出产物。改了 settings.yaml 却没重新生成，文档就开始撒谎；
      # 生成器同时会校验中英两份 settings 的字段一一对应。
      - name: 配置参考与 settings.yaml 同步
        run: |
          python scripts/gen-settings-reference.py --lang all
          git diff --exit-code -- docs/SETTINGS.md docs/SETTINGS.en.md

      - name: 构建
        run: pnpm build

      - name: 打包
        run: python scripts/package-theme.py

      - name: 校验发行包
        run: python scripts/verify-package.py

      - name: 资源体积概览
        run: python scripts/report-asset-size.py >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: theme-packages
          path: dist/*.zip
          retention-days: 14
