apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: halo-theme-clay-user-annotation-setting
spec:
  targetRef:
    group: ""
    kind: User
  formSchema:
    - $formkit: attachment
      name: "halo-theme-clay/author-header-image"
      label: Auther Page Header Image

---
apiVersion: v1alpha1
kind: AnnotationSetting
metadata:
  name: halo-theme-clay-post-annotation-setting
spec:
  targetRef:
    group: content.halo.run
    kind: Post
  formSchema:
    - $formkit: "text"
      name: "halo-theme-clay/page-title"
      label: Page Title
    - $formkit: "text"
      name: "halo-theme-clay/page-language"
      label: Page Language
    - $formkit: "switch"
      label: "Show in Post List"
      name: "halo-theme-clay/show-in-post-list"
      value: "true"
      onValue: "true"
      offValue: "false"

