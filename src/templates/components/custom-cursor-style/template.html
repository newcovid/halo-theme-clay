<head th:remove="tag">
  <script
    src="index.ts"
    type="module"
  ></script>
  <th:block th:object="${theme.config?.styles}">
    <!--/*/
    <style th:inline="css">
      :root {
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_default)}"]*/
        --clay-cursor-default: url("[(*{custom_cursor_files_default})]"), default;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_pointer)}"]*/
        --clay-cursor-pointer: url("[(*{custom_cursor_files_pointer})]"), pointer;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_text)}"]*/
        --clay-cursor-text: url("[(*{custom_cursor_files_text})]"), text;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_vertical_text)}"]*/
        --clay-cursor-vertical-text: url("[(*{custom_cursor_files_vertical_text})]"), vertical-text;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_help)}"]*/
        --clay-cursor-help: url("[(*{custom_cursor_files_help})]"), help;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_wait)}"]*/
        --clay-cursor-wait: url("[(*{custom_cursor_files_wait})]"), wait;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_cell)}"]*/
        --clay-cursor-cell: url("[(*{custom_cursor_files_cell})]"), cell;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_crosshair)}"]*/
        --clay-cursor-crosshair: url("[(*{custom_cursor_files_crosshair})]"), crosshair;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_move)}"]*/
        --clay-cursor-move: url("[(*{custom_cursor_files_move})]"), move;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_not_allowed)}"]*/
        --clay-cursor-not-allowed: url("[(*{custom_cursor_files_not_allowed})]"), not-allowed;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_grab)}"]*/
        --clay-cursor-grab: url("[(*{custom_cursor_files_grab})]"), grab;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_grabbing)}"]*/
        --clay-cursor-grabbing: url("[(*{custom_cursor_files_grabbing})]"), grabbing;
        /*[/]*/
        /*[# th:unless="*{#strings.isEmpty(custom_cursor_files_ew_resize)}"]*/
        --clay-cursor-ew-resize: url("[(*{custom_cursor_files_ew_resize})]"), ew-resize;
        /*[/]*/
      }
    </style>
    /*/-->
  </th:block>
</head>

<body th:remove="tag"></body>
