<!doctype html>
<th:block
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{components/base-layout/template :: html(
    title = |#{page.friends.page-title} - ${site.title}|,
    head = ~{:: head},
    content = ~{:: body},
    header = ~{components/header/template :: body},
    navbar = ~{}
  )}"
>
  <head th:remove="tag">
    <link
      rel="canonical"
      th:if="${theme.config?.friends_page_styles?.is_enable_canonical_link}"
      th:href="${siteUrl} + @{/friends}"
    />
    <script
      src="@runtime/pages/friends/index.ts"
      type="module"
    ></script>
    <th:block th:insert="~{components/header/template :: head}"></th:block>
    <th:block th:insert="~{components/list-friends-summary/template :: head(friends = ${friends})}"></th:block>
  </head>
  <body th:remove="tag">
    <article
      id="friends"
      class="friends"
      itemscope
      itemtype="http://schema.org/CollectionPage"
      th:if="${pluginFinder.available('plugin-friends')}"
    >
      <h1>
        <a
          th:href="@{/friends}"
          th:text="#{page.friends.title}"
          >朋友圈标题替换位</a
        >
      </h1>
      <th:block
        th:insert="~{components/list-friends-summary/template :: body(friends = ${friends}, pageTemplateName = 'friends')}"
      ></th:block>
    </article>
    <!--/* plugin-friends 未安装时，插件路由注入的模型变量不存在，页面会静默空白。
           与 index.html 一致：给出明确提示与文档入口。 */-->
    <div
      class="content"
      th:unless="${pluginFinder.available('plugin-friends')}"
    >
      <p th:text="#{page.index.friendsPluginNotAvailable}">插件未启用提示替换位</p>
      <p>
        <span th:text="#{page.index.friendsPluginNotAvailableDescription}"></span>
        <a
          th:text="#{page.index.friendsPluginDocsLinkText}"
          th:href="#{page.index.friendsPluginDocsLink}"
          rel="noopener"
          target="_blank"
        ></a>
      </p>
    </div>
  </body>
</th:block>
