<!doctype html>
<th:block
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{components/base-layout/template :: html(
    title = |${linksTitle ?: #messages.msg('page.links.page-title')} - ${site.title}|,
    head = ~{:: head},
    content = ~{:: body},
    header = ~{components/header/template :: body},
    navbar = ~{}
  )}"
>
  <head th:remove="tag">
    <link
      rel="canonical"
      th:if="${theme.config?.links_page_styles?.is_enable_canonical_link}"
      th:href="${siteUrl} + @{/links}"
    />
    <script
      src="@runtime/pages/links/index.ts"
      type="module"
    ></script>
    <th:block th:insert="~{components/header/template :: head}"></th:block>
  </head>
  <body th:remove="tag">
    <article
      id="links"
      class="post"
      itemscope
      itemtype="http://schema.org/BlogPosting"
      th:if="${pluginFinder.available('PluginLinks')}"
    >
      <div
        class="content"
        th:unless="${theme.config?.links_page_styles?.is_head_first_style}"
      >
        <th:block
          th:each="group : ${groups}"
          th:unless="${#lists.isEmpty(group.links)}"
        >
          <h3
            th:if="${#lists.size(groups) > 1}"
            th:text="${group.spec.displayName}"
          ></h3>
          <ul>
            <li th:each="link : ${group.links}">
              <a
                class="fir-image-figure"
                rel="noopener"
                target="_blank"
                th:href="@{${link.spec.url}}"
              >
                <figure class="fir-imageover">
                  <img
                    loading="lazy"
                    class="fir-author-image fir-clickcircle"
                    th:src="${#strings.isEmpty(link.spec?.logo) ? '/themes/halo-theme-clay/assets/images/logo.png' : link.spec.logo}"
                    th:alt="${link.spec.displayName}"
                    th:aria-label="#{page.links.link-logo.aria-label}"
                  />
                  <figcaption>
                    <div
                      class="fig-author-figure-title"
                      th:text="${link.spec.displayName}"
                    ></div>
                    <div
                      class="fig-author-figure-description"
                      th:utext="${link.spec.description}"
                    ></div>
                  </figcaption>
                </figure>
              </a>
            </li>
          </ul>
        </th:block>
      </div>
      <div
        class="content head-first-style"
        th:if="${theme.config?.links_page_styles?.is_head_first_style}"
      >
        <th:block
          th:each="group : ${groups}"
          th:unless="${#lists.isEmpty(group.links)}"
        >
          <h3
            th:if="${#lists.size(groups) > 1}"
            th:text="${group.spec.displayName}"
          ></h3>
          <ul class="links-grid">
            <li
              th:each="link : ${group.links}"
              th:with="max_lines = ${theme.config?.links_page_styles?.link_description_max_lines}"
            >
              <a
                class="link-card"
                rel="noopener"
                target="_blank"
                th:href="@{${link.spec.url}}"
              >
                <img
                  loading="lazy"
                  class="link-avatar"
                  th:src="${#strings.isEmpty(link.spec?.logo) ? '/themes/halo-theme-clay/assets/images/logo.png' : link.spec.logo}"
                  th:alt="${link.spec.displayName}"
                  th:aria-label="#{page.links.link-logo.aria-label}"
                />
                <div class="link-info">
                  <div
                    class="link-title"
                    th:text="${link.spec.displayName}"
                  ></div>
                  <div
                    class="link-description"
                    th:utext="${link.spec.description}"
                    th:classappend="|${max_lines == '1' ? 'tw:line-clamp-1' : ''} ${max_lines == '2' ? 'tw:line-clamp-2' : ''} ${max_lines == '3' ? 'tw:line-clamp-3' : ''} ${max_lines == '4' ? 'tw:line-clamp-4' : ''} ${max_lines == '5' ? 'tw:line-clamp-5' : ''}|"
                  ></div>
                </div>
              </a>
            </li>
          </ul>
        </th:block>
      </div>
    </article>
    <!--/* PluginLinks 未安装时 groups / linksTitle 这两个模型变量不存在，
           th:each 遇 null 不会报错，页面会渲染成完全空白。给出明确提示。 */-->
    <div
      class="content"
      th:unless="${pluginFinder.available('PluginLinks')}"
    >
      <p th:text="#{page.links.pluginNotAvailable}">插件未启用提示替换位</p>
      <p>
        <span th:text="#{page.links.pluginNotAvailableDescription}"></span>
        <a
          th:text="#{page.links.pluginDocsLinkText}"
          th:href="#{page.links.pluginDocsLink}"
          rel="noopener"
          target="_blank"
        ></a>
      </p>
    </div>
  </body>
</th:block>
